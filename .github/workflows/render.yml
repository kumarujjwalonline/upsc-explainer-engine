name: Render explainer

# Triggered by n8n (GitHub API: workflow_dispatch) after it commits jobs/<job_id>.json.
# Free on public repos. Outputs go to a GitHub Release, and n8n is called back with the links.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job file name in jobs/ (without .json)"
        required: true
      mode:
        description: "assets = build terrain packs + fetch Commons photos listed in the job and commit them (for a local look first), parallel = like voiced, rendered in parallel slices on several runners (for long 3D map videos), transcribe = word timings for takes in voice-takes/<id>/ (committed back), sample = 30 s voice check, full = video + Shorts + thumbnail, voiced = like full but uses the scene audio already committed in public/jobs/<id>/ (voiced in a Claude thread), preview = no voice, half-size layout check"
        required: true
        default: full
        type: choice
        options: [sample, full, voiced, preview, transcribe, assets, parallel, publish]
      from_run:
        description: "publish only: id of an earlier parallel run whose slices to join"
        required: false
        default: ""
      callback_url:
        description: "n8n webhook to call when done (optional)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: render-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  transcribe:
    if: inputs.mode == 'transcribe'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-v1
      - name: Transcribe takes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet faster-whisper numpy
          python3 scripts/transcribe_takes.py voice-takes/${{ inputs.job_id }}
      - name: Commit word timings
        run: |
          git config user.name "explainer-bot"
          git config user.email "explainer-bot@users.noreply.github.com"
          git add voice-takes/${{ inputs.job_id }}/*.words.json
          git commit -m "Word timings for ${{ inputs.job_id }} voice takes"
          git push origin HEAD:${{ github.ref_name }}

  render:
    if: inputs.mode != 'transcribe' && inputs.mode != 'assets' && inputs.mode != 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JOB: jobs/${{ inputs.job_id }}.json
      TAG: render-${{ inputs.job_id }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: Audio check tools (free speech recognition)
        if: inputs.mode != 'preview' && inputs.mode != 'voiced'
        run: pip install --quiet faster-whisper praat-parselmouth numpy pillow

      - name: Restore speech model
        if: inputs.mode != 'preview' && inputs.mode != 'voiced'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-v1

      - name: Type check
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Sound effects
        run: bash scripts/sfx.sh public/sfx

      - name: Restore earlier voice clips
        uses: actions/cache/restore@v4
        with:
          path: .voice-cache
          key: voice-${{ inputs.job_id }}-${{ github.run_id }}
          restore-keys: voice-${{ inputs.job_id }}-

      - name: Voice (Kumar Ujjwal Hindi, Upsc Explainers)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_v3' }}
        run: |
          mkdir -p out
          set -o pipefail
          if ! bash scripts/voice_qc.sh "$JOB" ${{ (inputs.mode == 'preview' || inputs.mode == 'voiced') && 'none' || inputs.mode }} 2>&1 | tee out/voice.log; then
            msg=$(grep -v '^\s*$' out/voice.log | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Voice step failed::$msg"
            exit 1
          fi

      - name: Remember pronunciations for future videos
        if: success() && inputs.mode != 'preview' && inputs.mode != 'voiced'
        run: |
          if [ "$(python3 scripts/remember_pron.py)" = "changed" ]; then
            git config user.name "explainer-bot"
            git config user.email "explainer-bot@users.noreply.github.com"
            git add pronunciations/indian-english.json
            git commit -m "Pronunciation dictionary: learned from ${{ inputs.job_id }}"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 3; done
          fi

      - name: Save voice clips for later runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .voice-cache
          key: voice-${{ inputs.job_id }}-${{ github.run_id }}

      - name: Source screenshots
        if: inputs.mode != 'sample'
        continue-on-error: true
        run: |
          if python3 -c "import json,sys; j=json.load(open('out/job.final.json')); sys.exit(0 if any((s.get('visual') or {}).get('type')=='source' for s in j['scenes']) else 1)"; then
            pip install --quiet playwright pillow
            python3 -m playwright install --with-deps chromium > /dev/null
            python3 scripts/fetch_sources.py out/job.final.json
          fi

      - name: Stock footage (Wikimedia Commons, Pexels if a key exists)
        if: inputs.mode != 'sample'
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 scripts/fetch_footage.py out/job.final.json

      - name: Render
        if: inputs.mode != 'sample'
        run: node scripts/render.mjs out/job.final.json ${{ inputs.mode == 'preview' && 'preview' || 'all' }}

      - name: Sync check sheets
        if: inputs.mode != 'sample'
        run: |
          pip install --quiet pillow
          VIDEO=$(ls out/*-long.mp4 out/*-preview.mp4 2>/dev/null | head -1)
          python3 scripts/sync_sheets.py out/job.final.json "$VIDEO"

      - name: Publish files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd out
          shopt -s nullglob
          files=(*.mp4 *.mp3 *.png *.jpg job.final*.json audio-qc*.json sync*.json sources-report*.json footage-report*.json)
          ls -la
          gh release create "$TAG" --title "$JOB_ID ($MODE)" --notes "Rendered by $RUN_URL" --prerelease "${files[@]}"
          node ../scripts/result.mjs "https://github.com/${{ github.repository }}/releases/download/$TAG"

      - name: Tell n8n
        if: success() && inputs.callback_url != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' --data @out/result.json "${{ inputs.callback_url }}"

      - name: Keep logs of a failed run
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out 2>/dev/null || exit 0
          shopt -s nullglob
          logs=(*.log audio-qc*.json)
          [ ${#logs[@]} -gt 0 ] && gh release create "debug-${{ inputs.job_id }}-${{ github.run_number }}" --title "debug ${{ inputs.job_id }}" --notes "Logs of a failed run" --prerelease "${logs[@]}" || true

      - name: Tell n8n about a failure
        if: failure() && inputs.callback_url != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"job_id\":\"${{ inputs.job_id }}\",\"mode\":\"${{ inputs.mode }}\",\"status\":\"failed\",\"run\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ inputs.callback_url }}"

  # ---------- assets: terrain packs and Commons photos, committed so they can be checked before a render
  assets:
    if: inputs.mode == 'assets' || inputs.mode == 'parallel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Terrain packs and photos
        run: |
          pip install --quiet numpy pillow
          python3 scripts/build_terrain.py jobs/${{ inputs.job_id }}.json
          python3 scripts/fetch_images.py jobs/${{ inputs.job_id }}.json
          python3 scripts/fetch_art.py jobs/${{ inputs.job_id }}.json || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p out && python3 scripts/fetch_footage.py jobs/${{ inputs.job_id }}.json || true
      - name: Commit them
        run: |
          git config user.name "explainer-bot"
          git config user.email "explainer-bot@users.noreply.github.com"
          for p in public/terrain public/jobs/${{ inputs.job_id }}/img public/jobs/${{ inputs.job_id }}/footage public/jobs/${{ inputs.job_id }}/art jobs/${{ inputs.job_id }}.json; do [ -e "$p" ] && git add -f "$p"; done; true
          if ! git diff --cached --quiet; then
            git commit -q -m "Terrain packs and photos for ${{ inputs.job_id }}"
            for i in 1 2 3; do git pull --rebase -q origin ${{ github.ref_name }} && git push -q origin HEAD:${{ github.ref_name }} && break; sleep 3; done
          fi

  # ---------- parallel: slices of the long video, the sound track, each Short and the thumbnail on their own runners
  plan:
    if: inputs.mode == 'parallel'
    needs: assets
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.p.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          j = json.load(open('jobs/${{ inputs.job_id }}.json'))
          n = 12
          t = [f'part {i} {n}' for i in range(n)] + ['thumb'] + [f"short {s['id']}" for s in j.get('shorts', [])]
          print('tasks=' + json.dumps(t))
          PY

  slice:
    if: inputs.mode == 'parallel'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: git pull -q origin ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Render ${{ matrix.task }}
        run: |
          bash scripts/sfx.sh public/sfx
          mkdir -p out
          node scripts/voice.mjs jobs/${{ inputs.job_id }}.json none
          node scripts/render.mjs out/job.final.json ${{ matrix.task }}
          echo "NAME=$(echo '${{ matrix.task }}' | tr ' ' '-')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.NAME }}
          path: |
            out/*.mp4
            out/*.aac
            out/*.png
            out/job.final.json
          retention-days: 5

  publish:
    if: always() && (inputs.mode == 'publish' || (inputs.mode == 'parallel' && needs.slice.result == 'success'))
    needs: slice
    runs-on: ubuntu-latest
    env:
      TAG: render-${{ inputs.job_id }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Join the slices
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          # The sound track comes straight from the scene clips (seconds, not a full Remotion pass).
          bash scripts/sfx.sh public/sfx
          mkdir -p out && python3 scripts/audio_track.py parts/job.final.json parts/${{ inputs.job_id }}-long.aac
          cd parts
          ls -la
          for f in $(ls seg-*.mp4 | sort); do echo "file '$PWD/$f'"; done > list.txt
          ffmpeg -v error -f concat -safe 0 -i list.txt -i ${{ inputs.job_id }}-long.aac -map 0:v -map 1:a -c copy -bsf:a aac_adtstoasc -movflags +faststart ../out/${{ inputs.job_id }}-long.mp4
          cp job.final.json *.png ../out/ 2>/dev/null || true
          for f in *.mp4; do case "$f" in seg-*) ;; *) cp "$f" ../out/ ;; esac; done
          ffprobe -v error -show_entries format=duration -of csv=p=0 ../out/${{ inputs.job_id }}-long.mp4
      - name: Publish files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
          MODE: ${{ inputs.mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd out
          shopt -s nullglob
          files=(*.mp4 *.png job.final*.json)
          gh release create "$TAG" --title "$JOB_ID ($MODE)" --notes "Rendered by $RUN_URL" --prerelease "${files[@]}"
          node ../scripts/result.mjs "https://github.com/${{ github.repository }}/releases/download/$TAG"
      - name: Tell n8n
        if: success() && inputs.callback_url != ''
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' --data @out/result.json "${{ inputs.callback_url }}"
